ot;',"'":'&#39;'}[c]));function filteredItems(name){return DATA.filter(x=>x.equipment===name&&(cycle==='전체'||x.cycle===cycle)&&(query===''||x.item.toLowerCase().includes(query.toLowerCase())))}function renderHeader(){document.getElementById('date').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});const total=DATA.filter(x=>cycle==='전체'||x.cycle===cycle).length;const done=DATA.filter(x=>(cycle==='전체'||x.cycle===cycle)&&state.checks[DATA.indexOf(x)]).length;document.getElementById('progressText').textContent=`${done} / ${total} 완료`}function render(){renderHeader();const main=document.getElementById('main');if(!current){const names=Object.keys(groups).filter(n=>n.includes(query));main.innerHTML=`<div class="toolbar">${['일상','주간','월간','전체'].map(c=>`<button class="tab ${cycle===c?'active':''}" data-cycle="${c}">${c}</button>`).join('')}</div><input class="search" id="search" placeholder="설비 또는 점검항목 검색" value="${esc(query)}"><div class="list">${names.map(n=>{const arr=groups[n].filter(x=>cycle==='전체'||x.cycle===cycle);const done=arr.filter(x=>state.checks[DATA.indexOf(x)]).length;return `<button class="equip" data-equip="${esc(n)}"><span><strong>${esc(n)}</strong><small>${done} / ${arr.length} 완료</small></span><span class="arrow">›</span></button>`}).join('')||'<div class="empty">해당 조건의 설비가 없습니다.</div>'}</div>`;main.querySelectorAll('[data-cycle]').forEach(b=>b.onclick=()=>{cycle=b.dataset.cycle;render()});main.querySelector('#search').oninput=e=>{query=e.target.value;render()};main.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{current=b.dataset.equip;query='';render()})}else{const arr=filteredItems(current);const done=arr.filter(x=>state.checks[DATA.indexOf(x)]).length;main.innerHTML=`<button class="back" id="back">← 설비 목록</button><div class="detailTitle">${esc(current)}</div><div class="sub">${cycle==='전체'?'전체 주기':cycle} · ${done} / ${arr.length} 완료</div><div class="progress"><div class="bar" style="width:${arr.length?done/arr.length*100:0}%"></div></div>${arr.map(x=>{const i=DATA.indexOf(x),v=state.checks[i]||{};return `<section class="item"><span class="cycle">${esc(x.cycle)}</span><div class="itemText">${esc(x.item)}</div><div class="actions"><button class="act ok ${v.result==='정상'?'sel':''}" data-i="${i}" data-v="정상">✓ 정상</button><button class="act bad ${v.result==='이상'?'sel':''}" data-i="${i}" data-v="이상">! 이상</button></div>${v.result==='이상'?`<textarea class="memo" data-memo="${i}" placeholder="이상 내용 메모">${esc(v.memo||'')}</textarea>`:''}</section>`}).join('')||'<div class="empty">이 주기의 점검항목이 없습니다.</div>'}<div class="footerActions"><button class="secondary" id="reset">오늘 체크 초기화</button><button class="primary" id="next">설비 목록으로</button></div>`;main.querySelector('#back').onclick=()=>{current=null;render()};main.querySelector('#next').onclick=()=>{current=null;render()};main.querySelector('#reset').onclick=()=>{if(confirm('오늘 체크한 내용을 모두 초기화할까요?')){state.checks={};save()}};main.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;state.checks[i]={result:b.dataset.v};save()});main.querySelectorAll('[data-memo]').forEach(t=>t.onchange=()=>{const i=+t.dataset.memo;state.checks[i]??={result:'이상'};state.checks[i].memo=t.value;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}})}}render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
