const DATA_KEY='equipment-check-data-v2', STATE_KEY='equipment-check-state-v2';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadData(){try{const x=JSON.parse(localStorage.getItem(DATA_KEY)||'null');return Array.isArray(x)&&x.length?x:DEFAULT_DATA.map(x=>({...x}));}catch(e){return DEFAULT_DATA.map(x=>({...x}));}}
let DATA=loadData();
function saveData(){localStorage.setItem(DATA_KEY,JSON.stringify(DATA));}
const periodKey=(c)=>{const d=new Date();if(c==='일상')return today();if(c==='월간')return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(c==='주간'){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}return '';};
const currentPeriods=()=>({일상:periodKey('일상'),주간:periodKey('주간'),월간:periodKey('월간')});
function loadState(){try{const x=JSON.parse(localStorage.getItem(STATE_KEY)||'null');const periods=currentPeriods();if(!x||!x.periods||!x.checks)return {periods,checks:{}};const checks=x.checks||{};['일상','주간','월간'].forEach(c=>{if(x.periods[c]!==periods[c])DATA.forEach((item,i)=>{if(item.cycle===c)delete checks[i]})});return {periods,checks}}catch(e){return {periods:currentPeriods(),checks:{}}}}
let state=loadState();
function saveState(){localStorage.setItem(STATE_KEY,JSON.stringify(state));}
let current=null,cycle='일상',query='',view='check';
const groups=()=>{const g={};DATA.forEach((x,i)=>(g[x.equipment]??=[]).push({...x,_i:i}));return g};
function filteredItems(name){return DATA.map((x,i)=>({...x,_i:i})).filter(x=>x.equipment===name&&(cycle==='전체'||x.cycle===cycle)&&(query===''||x.item.toLowerCase().includes(query.toLowerCase())))}
function renderHeader(){document.getElementById('date').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});let total=DATA.filter(x=>cycle==='전체'||x.cycle===cycle).length;let done=DATA.reduce((n,x,i)=>n+((cycle==='전체'||x.cycle===cycle)&&state.checks[i]?.result?1:0),0);document.getElementById('progressText').textContent=`${done} / ${total} 완료`;document.getElementById('itemCount').textContent=`${DATA.length}개 항목`;document.getElementById('adminBtn').style.display=view==='admin'?'none':'';document.getElementById('homeBtn').style.display=view==='admin'?'':'none';}
function render(){renderHeader();view==='admin'?renderAdmin():renderCheck();}
function renderCheck(){const main=document.getElementById('main');const g=groups();if(!current){const names=Object.keys(g).filter(n=>n.includes(query)||g[n].some(x=>x.item.toLowerCase().includes(query.toLowerCase())));main.innerHTML=`<div class="toolbar">${['일상','주간','월간','전체'].map(c=>`<button type="button" class="tab ${cycle===c?'active':''}" data-cycle="${c}">${c}</button>`).join('')}</div><input class="search" id="search" placeholder="설비 또는 점검항목 검색" value="${esc(query)}"><div class="list">${names.map(n=>{const arr=g[n].filter(x=>cycle==='전체'||x.cycle===cycle);const done=arr.filter(x=>state.checks[x._i]?.result).length;return `<button type="button" class="equip" data-equip="${esc(n)}"><span><strong>${esc(n)}</strong><small>${done} / ${arr.length} 완료</small></span><span class="arrow">›</span></button>`}).join('')||'<div class="empty">해당 조건의 설비가 없습니다.</div>'}</div>`;main.querySelectorAll('[data-cycle]').forEach(b=>b.onclick=()=>{cycle=b.dataset.cycle;render()});main.querySelector('#search').oninput=e=>{query=e.target.value;render()};main.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{current=b.dataset.equip;query='';render()});return}
const arr=filteredItems(current),done=arr.filter(x=>state.checks[x._i]?.result).length;main.innerHTML=`<button type="button" class="back" id="back">← 설비 목록</button><div class="detailTitle">${esc(current)}</div><div class="sub">${cycle==='전체'?'전체 주기':cycle} · ${done} / ${arr.length} 완료</div><div class="progress"><div class="bar" style="width:${arr.length?done/arr.length*100:0}%"></div></div>${arr.map(x=>{const v=state.checks[x._i]||{};return `<section class="item"><span class="cycle">${esc(x.cycle)}</span><div class="itemText">${esc(x.item)}</div><div class="actions"><button type="button" class="act ok ${v.result==='정상'?'sel':''}" data-i="${x._i}" data-v="정상">✓ 정상</button><button type="button" class="act bad ${v.result==='이상'?'sel':''}" data-i="${x._i}" data-v="이상">! 이상</button></div>${v.result==='이상'?`<textarea class="memo" data-memo="${x._i}" placeholder="이상 내용 메모">${esc(v.memo||'')}</textarea>`:''}</section>`}).join('')||'<div class="empty">이 주기의 점검항목이 없습니다.</div>'}<div class="footerActions"><button type="button" class="secondary" id="reset">현재 주기 초기화</button><button type="button" class="primary" id="next">설비 목록으로</button></div>`;main.querySelector('#back').onclick=()=>{current=null;render()};main.querySelector('#next').onclick=()=>{current=null;render()};main.querySelector('#reset').onclick=()=>{const target=cycle==='전체'?'일상·주간·월간':cycle;if(confirm(`${target} 체크 내용을 초기화할까요?`)){if(cycle==='전체'){state.checks={}}else DATA.forEach((item,i)=>{if(item.cycle===cycle)delete state.checks[i]});state.periods=currentPeriods();saveState();render()}};main.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;state.checks[i]={result:b.dataset.v};saveState();render()});main.querySelectorAll('[data-memo]').forEach(t=>t.onchange=()=>{const i=+t.dataset.memo;state.checks[i]??={result:'이상'};state.checks[i].memo=t.value;saveState()});}
function renderAdmin(){const main=document.getElementById('main');const g=groups();const names=Object.keys(g);if(!window.adminEquip||!names.includes(window.adminEquip))window.adminEquip=names[0]||'';main.innerHTML=`<button type="button" class="back" id="adminBack">← 점검 화면</button><div class="panel"><h2>점검항목 추가</h2><div class="field"><label>설비명</label><select id="newEquip">${names.map(n=>`<option value="${esc(n)}" ${n===window.adminEquip?'selected':''}>${esc(n)}</option>`).join('')}<option value="__new__">+ 새 설비 입력</option></select><input id="newEquipText" placeholder="새 설비명을 입력" style="display:none;margin-top:8px"><div class="notice">기존 설비를 선택하거나 새 설비를 만들 수 있습니다.</div></div><div class="field"><label>주기</label><select id="newCycle"><option>일상</option><option>주간</option><option>월간</option></select></div><div class="field"><label>점검항목</label><input id="newItem" placeholder="점검할 내용을 입력"></div><button type="button" class="primary" id="addItem">점검항목 추가</button></div><div class="panel"><h2>설비별 점검항목</h2><div class="field"><label>설비 선택</label><select class="adminSelect" id="adminEquip">${names.map(n=>`<option value="${esc(n)}" ${n===window.adminEquip?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="adminEquipTitle" id="adminEquipTitle"></div><input class="search" id="adminSearch" placeholder="선택한 설비의 항목 검색" value="${esc(query)}"><div id="adminList">${renderAdminList(query)}</div></div><div class="panel"><h2>데이터 백업</h2><div class="row"><button type="button" class="smallBtn" id="exportBtn">백업 파일 만들기</button><button type="button" class="smallBtn" id="importBtn">백업 불러오기</button></div><input type="file" id="fileInput" accept="application/json" hidden><div class="notice">이 휴대폰의 앱 안에 저장된 점검항목을 백업/복원할 수 있습니다. GitHub의 원본 파일을 자동으로 바꾸는 기능은 아닙니다.</div></div>`;main.querySelector('#adminBack').onclick=()=>{view='check';query='';render()};const newEquip=main.querySelector('#newEquip'),newEquipText=main.querySelector('#newEquipText');newEquip.onchange=()=>{newEquipText.style.display=newEquip.value==='__new__'?'block':'none'};main.querySelector('#addItem').onclick=()=>{let equipment=newEquip.value==='__new__'?newEquipText.value.trim():newEquip.value;const item=main.querySelector('#newItem').value.trim(),cy=main.querySelector('#newCycle').value;if(!equipment||!item){alert('설비명과 점검항목을 입력해주세요.');return}if(!names.includes(equipment)&&equipment!=='__new__')equipment=equipment;DATA.push({equipment,cycle:cy,item});window.adminEquip=equipment;saveData();query='';render()};main.querySelector('#adminEquip').onchange=e=>{window.adminEquip=e.target.value;query='';render()};main.querySelector('#adminSearch').oninput=e=>{query=e.target.value;main.querySelector('#adminList').innerHTML=renderAdminList(query);bindAdminList(main)};bindAdminList(main);main.querySelector('#exportBtn').onclick=exportData;main.querySelector('#importBtn').onclick=()=>main.querySelector('#fileInput').click();main.querySelector('#fileInput').onchange=importData;main.querySelector('#adminEquipTitle').textContent=`${window.adminEquip} · ${DATA.filter(x=>x.equipment===window.adminEquip).length}개 항목`}
function renderAdminList(q){const qq=(q||'').toLowerCase();const selected=window.adminEquip||'';const arr=DATA.map((x,i)=>({...x,_i:i})).filter(x=>x.equipment===selected&&(!qq||x.item.toLowerCase().includes(qq)));if(!arr.length)return '<div class="empty">이 설비에 해당하는 점검항목이 없습니다.</div>';return arr.map((x,pos)=>`<div class="adminItem"><div class="name">${pos+1}. ${esc(x.item)}</div><div class="adminMeta">${esc(x.cycle)}</div><div class="adminBtns"><button type="button" data-edit="${x._i}">수정</button><button type="button" class="del" data-del="${x._i}">삭제</button></div><div class="moveBtns"><button type="button" data-up="${x._i}" ${pos===0?'disabled':''}>▲ 위로</button><button type="button" data-down="${x._i}" ${pos===arr.length-1?'disabled':''}>▼ 아래로</button></div></div>`).join('')}
function bindAdminList(root){root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(+b.dataset.edit));root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const i=+b.dataset.del;if(confirm(`이 점검항목을 삭제할까요?\n\n${DATA[i].item}`)){DATA.splice(i,1);saveData();render()}});root.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveItem(+b.dataset.up,-1));root.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveItem(+b.dataset.down,1))}
function moveItem(i,dir){const equipment=DATA[i].equipment;const same=[];DATA.forEach((x,idx)=>{if(x.equipment===equipment)same.push(idx)});const pos=same.indexOf(i);const targetPos=pos+dir;if(pos<0||targetPos<0||targetPos>=same.length)return;const j=same[targetPos];[DATA[i],DATA[j]]=[DATA[j],DATA[i]];[state.checks[i],state.checks[j]]=[state.checks[j],state.checks[i]];saveData();saveState();render()}
function editItem(i){
  const item=DATA[i];
  if(!item)return;
  const old=document.getElementById('editModal');
  if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.id='editModal';
  wrap.className='modalBackdrop';
  wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <h2 id="editTitle">점검항목 수정</h2>
    <div class="field"><label>설비명</label><input id="editEquip" value="${esc(item.equipment)}"></div>
    <div class="field"><label>주기</label><select id="editCycle"><option value="일상">일상</option><option value="주간">주간</option><option value="월간">월간</option></select></div>
    <div class="field"><label>점검항목</label><textarea id="editItem" rows="3">${esc(item.item)}</textarea></div>
    <div class="modalActions"><button type="button" class="modalCancel" id="editCancel">취소</button><button type="button" class="modalSave" id="editSave">저장</button></div>
  </div>`;
  document.body.appendChild(wrap);
  const cycleEl=wrap.querySelector('#editCycle');
  cycleEl.value=['일상','주간','월간'].includes(item.cycle)?item.cycle:'일상';
  wrap.querySelector('#editCancel').onclick=()=>wrap.remove();
  wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()});
  wrap.querySelector('#editSave').onclick=()=>{
    const equipment=wrap.querySelector('#editEquip').value.trim();
    const cycle=cycleEl.value;
    const text=wrap.querySelector('#editItem').value.trim();
    if(!equipment||!text){alert('설비명과 점검항목을 입력해주세요.');return;}
    const oldEquipment=item.equipment;
    item.equipment=equipment;
    item.cycle=cycle;
    item.item=text;
    saveData();
    if(oldEquipment!==equipment)window.adminEquip=equipment;
    wrap.remove();
    query='';
    render();
  };
  setTimeout(()=>wrap.querySelector('#editItem').focus(),0);
}
function exportData(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='설비점검_항목백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x)||x.some(v=>!v.equipment||!v.cycle||!v.item))throw Error();if(confirm(`백업 파일의 ${x.length}개 항목으로 교체할까요?`)){DATA=x;saveData();render()}}catch(err){alert('올바른 설비점검 백업 파일이 아닙니다.')}};r.readAsText(f)}
document.getElementById('homeBtn').onclick=()=>{view='check';current=null;query='';render()};document.getElementById('adminBtn').onclick=()=>{view='admin';current=null;query='';render()};render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
